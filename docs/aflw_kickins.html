<script type="module">
  function formatUpdatedAEST(iso) {
    const d = new Date(iso);
    const parts = Object.fromEntries(
      new Intl.DateTimeFormat("en-AU", {
        timeZone: "Australia/Melbourne",
        day: "numeric",
        month: "long",
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
        timeZoneName: "short"
      }).formatToParts(d).map(p => [p.type, p.value])
    );
    const day = parseInt(parts.day, 10);
    const ord = (day % 10 === 1 && day !== 11) ? "st"
              : (day % 10 === 2 && day !== 12) ? "nd"
              : (day % 10 === 3 && day !== 13) ? "rd" : "th";
    return day + ord + " " + parts.month + " "
      + parts.hour + ":" + parts.minute + parts.dayPeriod.toLowerCase()
      + " " + parts.timeZoneName;
  }

        el.style.display = "block";
      }
    } catch (e) {
      console.warn("Could not load last-updated metadata:", e);
    }

    data.forEach(row => {
      Object.keys(row).forEach(key => {
        if (/^R\d+$/.test(key) && row[key] !== null && row[key] !== undefined) {
          roundCols.add(key);
        }
      });
    });

    const emptyRounds = [];
    for (let i = 1; i <= 12; i++) {
      const colId = "R" + i;
      if (!roundCols.has(colId)) emptyRounds.push(colId);
    }
    Reactable.setHiddenColumns("kickin_table", ["playerId", ...emptyRounds]);

    applyFilters();

    document.getElementById("loading-state").style.display = "none";
    document.getElementById("filter-bar").style.display = "flex";
    document.getElementById("kickin_table").style.display = "block";
    showLastUpdated(objectName);
  })();
</script>
